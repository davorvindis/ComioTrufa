<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComioTrufa</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }
        header {
            background: #16213e;
            padding: 14px;
            text-align: center;
            border-bottom: 3px solid #e94560;
        }
        header h1 { font-size: 22px; }
        header h1 span { color: #e94560; }

        /* Status bar */
        .status-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 12px;
            background: #0f3460;
        }
        @media (max-width: 600px) {
            .status-bar { grid-template-columns: repeat(2, 1fr); }
        }
        .status-card {
            background: #16213e;
            border-radius: 10px;
            padding: 10px 12px;
            text-align: center;
        }
        .status-card .label { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
        .status-card .value { font-size: 18px; font-weight: bold; margin-top: 2px; }
        .status-card .value.food { color: #4ade80; }
        .status-card .value.empty { color: #f87171; }
        .status-card .value.unknown { color: #fbbf24; }

        /* Date navigation */
        .date-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 12px;
            background: #16213e;
        }
        .date-nav button {
            background: #0f3460;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        .date-nav button:hover { background: #e94560; }
        .date-nav button:disabled { opacity: 0.3; cursor: default; }
        .date-nav .date-display {
            font-size: 16px;
            font-weight: 600;
            min-width: 140px;
            text-align: center;
        }
        .date-nav .date-sub { font-size: 11px; color: #888; }

        /* Tabs */
        .tabs {
            display: flex;
            justify-content: center;
            background: #16213e;
            border-top: 1px solid #0f3460;
        }
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            color: #888;
            font-weight: 500;
            font-size: 14px;
        }
        .tab:hover { color: #ccc; }
        .tab.active { color: #e94560; border-bottom-color: #e94560; }

        .content { max-width: 1000px; margin: 0 auto; padding: 12px; }

        /* Action buttons */
        .actions {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        .btn-primary { background: #e94560; color: white; }
        .btn-secondary { background: #0f3460; color: white; }
        .btn:disabled { opacity: 0.5; }

        /* Photos grid */
        .photos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 10px;
        }
        @media (max-width: 600px) {
            .photos-grid { grid-template-columns: repeat(2, 1fr); gap: 6px; }
        }
        .photo-card {
            background: #16213e;
            border-radius: 10px;
            overflow: hidden;
        }
        .photo-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }
        @media (max-width: 600px) {
            .photo-card img { height: 120px; }
        }
        .photo-card .info { padding: 8px; }
        .photo-card .info .time { font-size: 12px; color: #888; }
        .state-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }
        .state-badge.food { background: #166534; color: #4ade80; }
        .state-badge.empty { background: #7f1d1d; color: #f87171; }
        .state-badge.unknown { background: #713f12; color: #fbbf24; }
        .photo-card .info .description {
            font-size: 11px;
            color: #aaa;
            margin-top: 4px;
            font-style: italic;
        }

        /* Lightbox zoom */
        .lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }
        .lightbox.open { display: flex; }
        .lightbox img {
            max-width: 95vw;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 8px;
        }
        .lightbox .lb-info {
            color: #ccc;
            margin-top: 10px;
            text-align: center;
            font-size: 14px;
        }
        .lightbox .lb-close {
            position: absolute;
            top: 16px; right: 20px;
            font-size: 32px;
            color: white;
            cursor: pointer;
            background: none;
            border: none;
        }
        .lightbox .lb-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 36px;
            color: white;
            cursor: pointer;
            background: none;
            border: none;
            padding: 20px;
        }
        .lightbox .lb-prev { left: 4px; }
        .lightbox .lb-next { right: 4px; }
        .photo-card { cursor: pointer; }

        /* Events list */
        .events-list { display: flex; flex-direction: column; gap: 6px; }
        .event-item {
            background: #16213e;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .event-item .emoji { font-size: 24px; }
        .event-item .details { flex: 1; }
        .event-item .details .action { font-weight: 600; font-size: 14px; }
        .event-item .details .time { font-size: 12px; color: #888; margin-top: 2px; }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 8px;
        }
        .stat-card {
            background: #16213e;
            border-radius: 10px;
            padding: 14px;
            text-align: center;
        }
        .stat-card .day { font-size: 13px; color: #888; }
        .stat-card .meals { font-size: 30px; font-weight: bold; color: #4ade80; margin: 4px 0; }
        .stat-card .times { font-size: 11px; color: #666; }

        /* Admin */
        .photo-card .delete-btn {
            position: absolute;
            top: 6px; right: 6px;
            background: rgba(220,38,38,0.8);
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px; height: 24px;
            font-size: 14px;
            cursor: pointer;
            display: none;
        }
        .photo-card:hover .delete-btn { display: block; }
        .photo-card { position: relative; }
        .admin-panel {
            background: #16213e;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
        }
        .admin-panel h3 { font-size: 14px; margin-bottom: 8px; color: #e94560; }
        .admin-panel input {
            background: #0f3460;
            border: 1px solid #333;
            color: white;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 13px;
            width: 80px;
        }
        .admin-panel label { font-size: 12px; color: #888; margin-right: 4px; }

        .hidden { display: none; }
        .empty-msg { text-align: center; color: #666; padding: 30px; font-size: 14px; }
        #photoRequest { text-align: center; padding: 8px; color: #fbbf24; font-size: 13px; }
        .footer { text-align: center; padding: 8px; color: #444; font-size: 11px; }
    </style>
</head>
<body>
    <header>
        <h1>ComioTrufa <span>🐕</span></h1>
    </header>

    <div class="status-bar">
        <div class="status-card">
            <div class="label">Plato</div>
            <div class="value" id="currentState">...</div>
        </div>
        <div class="status-card">
            <div class="label">Ultima lectura</div>
            <div class="value" id="lastReading" style="font-size:14px">...</div>
        </div>
        <div class="status-card">
            <div class="label">Ultima comida</div>
            <div class="value" id="lastEat" style="font-size:14px">...</div>
        </div>
        <div class="status-card">
            <div class="label">Hoy</div>
            <div class="value" id="todayMeals">...</div>
        </div>
    </div>

    <div class="date-nav">
        <button onclick="prevDay()" id="btnPrev">&lt;</button>
        <div>
            <div class="date-display" id="dateDisplay">Hoy</div>
            <div class="date-sub" id="dateSub"></div>
        </div>
        <button onclick="nextDay()" id="btnNext">&gt;</button>
        <button onclick="goToday()" class="btn btn-secondary" style="font-size:12px">Hoy</button>
    </div>

    <div class="tabs">
        <div class="tab active" data-tab="photos" onclick="showTab('photos')">Fotos</div>
        <div class="tab" data-tab="events" onclick="showTab('events')">Eventos</div>
        <div class="tab" data-tab="stats" onclick="showTab('stats')">Semana</div>
        <div class="tab" data-tab="admin" onclick="showTab('admin')">Admin</div>
    </div>

    <div class="content">
        <div id="tab-photos">
            <div class="actions">
                <button onclick="requestPhoto()" id="btnRequestPhoto" class="btn btn-primary">Pedir foto ahora</button>
                <button onclick="loadPhotos()" class="btn btn-secondary">Actualizar</button>
            </div>
            <div id="photoRequest" class="hidden"></div>
            <div class="photos-grid" id="photosGrid"></div>
        </div>
        <div id="tab-events" class="hidden">
            <div class="events-list" id="eventsList"></div>
        </div>
        <div id="tab-stats" class="hidden">
            <div class="stats-grid" id="statsGrid"></div>
        </div>
        <div id="tab-admin" class="hidden">
            <div class="admin-panel">
                <h3>Corregir stats del dia</h3>
                <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
                    <label>Fecha:</label><input type="date" id="adminDate" style="width:140px">
                    <label>Comidas:</label><input type="number" id="adminMeals" min="0" value="0">
                    <label>Primera:</label><input type="time" id="adminFirst" style="width:100px">
                    <label>Ultima:</label><input type="time" id="adminLast" style="width:100px">
                    <button onclick="saveStats()" class="btn btn-primary" style="font-size:12px">Guardar</button>
                </div>
                <div id="adminMsg" style="font-size:12px;color:#4ade80"></div>
            </div>
            <div class="admin-panel">
                <h3>Acciones</h3>
                <button onclick="resetState()" class="btn btn-secondary" style="font-size:12px">Resetear estado</button>
                <span style="font-size:11px;color:#666;margin-left:8px">Pone el estado en "desconocido"</span>
            </div>
        </div>
    </div>

    <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
        <button class="lb-close" onclick="closeLightbox()">&times;</button>
        <button class="lb-nav lb-prev" onclick="lbNav(-1)">&lsaquo;</button>
        <button class="lb-nav lb-next" onclick="lbNav(1)">&rsaquo;</button>
        <img id="lbImg" src="" alt="">
        <div class="lb-info" id="lbInfo"></div>
    </div>

    <div class="footer">Se actualiza cada 30s</div>

    <script>
        let currentDate = new Date();
        const today = new Date();
        let currentPhotos = [];
        let lbIndex = 0;

        function openLightbox(index) {
            lbIndex = index;
            const r = currentPhotos[index];
            document.getElementById('lbImg').src = r.image_url;
            document.getElementById('lbInfo').textContent =
                `${formatTime(r.timestamp)} - ${stateText(r.state)} (${(r.confidence*100).toFixed(0)}%)`;
            document.getElementById('lightbox').classList.add('open');
        }

        function closeLightbox(e) {
            if (e && e.target !== e.currentTarget && !e.target.classList.contains('lb-close')) return;
            document.getElementById('lightbox').classList.remove('open');
        }

        function lbNav(dir) {
            lbIndex = (lbIndex + dir + currentPhotos.length) % currentPhotos.length;
            const r = currentPhotos[lbIndex];
            document.getElementById('lbImg').src = r.image_url;
            document.getElementById('lbInfo').textContent =
                `${formatTime(r.timestamp)} - ${stateText(r.state)} (${(r.confidence*100).toFixed(0)}%)`;
        }

        document.addEventListener('keydown', e => {
            if (!document.getElementById('lightbox').classList.contains('open')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') lbNav(-1);
            if (e.key === 'ArrowRight') lbNav(1);
        });

        function dateStr(d) {
            return d.toISOString().split('T')[0];
        }

        function isToday(d) {
            return dateStr(d) === dateStr(today);
        }

        function formatDateDisplay(d) {
            if (isToday(d)) return 'Hoy';
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            if (dateStr(d) === dateStr(yesterday)) return 'Ayer';
            return d.toLocaleDateString('es-AR', { weekday: 'short', day: 'numeric', month: 'short' });
        }

        function updateDateNav() {
            document.getElementById('dateDisplay').textContent = formatDateDisplay(currentDate);
            document.getElementById('dateSub').textContent = dateStr(currentDate);
            document.getElementById('btnNext').disabled = isToday(currentDate);
        }

        function prevDay() {
            currentDate.setDate(currentDate.getDate() - 1);
            updateDateNav();
            refreshCurrentTab();
        }

        function nextDay() {
            if (!isToday(currentDate)) {
                currentDate.setDate(currentDate.getDate() + 1);
                updateDateNav();
                refreshCurrentTab();
            }
        }

        function goToday() {
            currentDate = new Date();
            updateDateNav();
            refreshCurrentTab();
        }

        function refreshCurrentTab() {
            const active = document.querySelector('.tab.active')?.dataset.tab;
            if (active === 'photos') loadPhotos();
            else if (active === 'events') loadEvents();
            else if (active === 'stats') loadStats();
        }

        async function fetchJSON(url) {
            const res = await fetch(url);
            return res.json();
        }

        function formatTime(ts) {
            if (!ts) return 'N/A';
            const d = new Date(ts.replace(' ', 'T'));
            return d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
        }

        function formatDateTime(ts) {
            if (!ts) return 'N/A';
            const d = new Date(ts.replace(' ', 'T'));
            return d.toLocaleString('es-AR', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' });
        }

        function stateText(state) {
            if (state === 'food') return 'Con comida';
            if (state === 'empty') return 'Vacio';
            return '?';
        }

        async function loadStatus() {
            try {
                const [status, today_stats] = await Promise.all([
                    fetchJSON('/api/status'),
                    fetchJSON('/api/today'),
                ]);

                const stateEl = document.getElementById('currentState');
                const state = status.current_state || 'unknown';
                stateEl.textContent = stateText(state);
                stateEl.className = 'value ' + state;

                const reading = status.last_reading;
                document.getElementById('lastReading').textContent = reading ? formatDateTime(reading.timestamp) : '-';
                document.getElementById('lastEat').textContent = status.last_eat_time ? formatDateTime(status.last_eat_time) : '-';
                document.getElementById('todayMeals').textContent = today_stats.meals_detected;
            } catch(e) { console.error('loadStatus error', e); }
        }

        async function loadPhotos() {
            try {
                const d = dateStr(currentDate);
                const readings = await fetchJSON(`/api/readings?limit=50&date=${d}`);
                const grid = document.getElementById('photosGrid');

                if (readings.length === 0) {
                    grid.innerHTML = `<div class="empty-msg">Sin fotos para ${formatDateDisplay(currentDate)}</div>`;
                    return;
                }

                currentPhotos = readings.filter(r => r.confidence >= 0.5);
                grid.innerHTML = readings.map((r, i) => {
                    let desc = '';
                    try { desc = JSON.parse(r.raw_response || '{}').description || ''; } catch(e) {}
                    return `
                        <div class="photo-card" onclick="openLightbox(${i})">
                            <button class="delete-btn" onclick="event.stopPropagation();deleteReading(${r.id})" title="Borrar">&times;</button>
                            <img src="${r.image_url}" alt="bowl" loading="lazy"
                                 onerror="this.style.background='#16213e';this.style.height='80px'">
                            <div class="info">
                                <div class="time">${formatTime(r.timestamp)}</div>
                                <span class="state-badge ${r.state}">${stateText(r.state)}</span>
                                <span style="font-size:11px;color:#666;margin-left:6px">${(r.confidence * 100).toFixed(0)}%</span>
                                ${desc ? `<div class="description">${desc}</div>` : ''}
                            </div>
                        </div>
                    `;
                }).join('');
            } catch(e) { console.error('loadPhotos error', e); }
        }

        async function loadEvents() {
            try {
                const d = dateStr(currentDate);
                const events = await fetchJSON(`/api/events?limit=50&date=${d}`);
                const list = document.getElementById('eventsList');

                if (events.length === 0) {
                    list.innerHTML = `<div class="empty-msg">Sin eventos para ${formatDateDisplay(currentDate)}</div>`;
                    return;
                }

                list.innerHTML = events.map(e => {
                    const isAte = e.event_type === 'dog_ate';
                    const emoji = isAte ? '🐕' : '🍽️';
                    const action = isAte ? 'Trufa comio!' : 'Plato rellenado';
                    return `
                        <div class="event-item">
                            <div class="emoji">${emoji}</div>
                            <div class="details">
                                <div class="action">${action}</div>
                                <div class="time">${formatTime(e.timestamp)} - Confianza: ${(e.confidence * 100).toFixed(0)}%</div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch(e) { console.error('loadEvents error', e); }
        }

        async function loadStats() {
            try {
                const stats = await fetchJSON('/api/week');
                const grid = document.getElementById('statsGrid');

                if (stats.length === 0) {
                    grid.innerHTML = '<div class="empty-msg">Sin datos de la semana</div>';
                    return;
                }

                grid.innerHTML = stats.map(s => `
                    <div class="stat-card">
                        <div class="day">${s.date}</div>
                        <div class="meals">${s.meals_detected}</div>
                        <div class="times">
                            ${s.first_meal_time ? s.first_meal_time.substring(0,5) : '--:--'} -
                            ${s.last_meal_time ? s.last_meal_time.substring(0,5) : '--:--'}<br>
                            ${s.refills} rellenado(s)
                        </div>
                    </div>
                `).join('');
            } catch(e) { console.error('loadStats error', e); }
        }

        function showTab(name) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.content > div').forEach(d => d.classList.add('hidden'));
            document.getElementById('tab-' + name).classList.remove('hidden');
            document.querySelector(`.tab[data-tab="${name}"]`).classList.add('active');
            refreshCurrentTab();
        }

        async function requestPhoto() {
            const btn = document.getElementById('btnRequestPhoto');
            const msg = document.getElementById('photoRequest');
            btn.disabled = true;
            btn.textContent = 'Pidiendo...';
            msg.classList.remove('hidden');
            msg.textContent = 'Esperando foto de la ESP32... (max ~10s)';

            try {
                await fetch('/api/request-photo', { method: 'POST' });
                let attempts = 0;
                const poll = setInterval(async () => {
                    attempts++;
                    const readings = await fetchJSON('/api/readings?limit=1&date=' + dateStr(new Date()));
                    if (readings.length > 0) {
                        const latest = new Date(readings[0].timestamp.replace(' ', 'T'));
                        if ((new Date() - latest) < 30000) {
                            clearInterval(poll);
                            msg.textContent = 'Foto recibida!';
                            goToday();
                            loadStatus();
                            setTimeout(() => msg.classList.add('hidden'), 3000);
                        }
                    }
                    if (attempts > 30) {
                        clearInterval(poll);
                        msg.textContent = 'No llego. Revisa la ESP32.';
                    }
                }, 10000);
            } catch(e) {
                msg.textContent = 'Error: ' + e.message;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Pedir foto ahora';
            }
        }

        async function deleteReading(id) {
            if (!confirm('Borrar esta foto?')) return;
            await fetch(`/api/reading/${id}`, { method: 'DELETE' });
            loadPhotos();
            loadStatus();
        }

        async function saveStats() {
            const date = document.getElementById('adminDate').value;
            if (!date) { alert('Elegí una fecha'); return; }
            const body = {
                date: date,
                meals: parseInt(document.getElementById('adminMeals').value) || 0,
                first_meal: document.getElementById('adminFirst').value || null,
                last_meal: document.getElementById('adminLast').value || null,
                refills: 0,
            };
            await fetch('/api/admin/fix-stats', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body),
            });
            document.getElementById('adminMsg').textContent = 'Stats guardadas!';
            loadStatus();
            setTimeout(() => document.getElementById('adminMsg').textContent = '', 3000);
        }

        async function resetState() {
            if (!confirm('Resetear estado a desconocido?')) return;
            await fetch('/api/admin/reset-state', { method: 'POST' });
            loadStatus();
        }

        // Init
        updateDateNav();
        loadStatus();
        loadPhotos();

        setInterval(() => {
            loadStatus();
            if (isToday(currentDate)) refreshCurrentTab();
        }, 30000);
    </script>
</body>
</html>
